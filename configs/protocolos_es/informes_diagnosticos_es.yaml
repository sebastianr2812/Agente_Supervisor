id_protocolo: "DLR-001-ES"
version: "1.0"
proceso_sanitario: "diagnostico_laboratorio"
tipo_documento: "informe_diagnostico"
fecha_vigencia: "2024-01-01"
base_legal: "Ley 41/2002, art. 15 (historia clinica)"
idioma: "spa"

campos_obligatorios:
  - nombre_zona: "identificacion_centro"
    tipo_contenido: "texto"
    zona_documento: "header"
    descripcion: "Nombre del hospital o laboratorio"
    # "centro" (sin mas contexto) se elimino de aqui (2026-09-07): colisiona
    # con el aviso legal fijo "Codigo de centro sanitario: verificado..."
    # presente en TODOS los documentos -- ver misma nota en
    # lista_medicacion_es.yaml.
    patrones_esperados: ["hospital", "laboratorio", "servicio"]
    peso: 2

  - nombre_zona: "identificacion_paciente"
    tipo_contenido: "texto"
    zona_documento: "header"
    descripcion: "Nombre del paciente e identificador (NHC o DNI)"
    patrones_esperados: ["paciente", "nhc", "historia clinica", "dni"]
    peso: 3

  - nombre_zona: "medico_solicitante"
    tipo_contenido: "texto"
    zona_documento: "header"
    descripcion: "Medico solicitante o responsable"
    patrones_esperados: ["medico", "dr.", "dra.", "solicitante", "colegiado"]
    peso: 2

  - nombre_zona: "fecha_servicio"
    tipo_contenido: "fecha"
    zona_documento: "header"
    descripcion: "Fecha de la prueba, recogida o informe"
    patron_regex: "\\d{1,2}[/-]\\d{1,2}[/-]\\d{2,4}"
    peso: 3

  - nombre_zona: "resultados"
    tipo_contenido: "texto"
    zona_documento: "body"
    descripcion: "Resultados de pruebas, hallazgos o valores con rangos de referencia"
    patrones_esperados: ["resultado", "valor", "referencia", "hallazgo", "determinacion"]
    min_chars: 20
    peso: 3

reglas_contenido:
  - id_regla: "RC-DLR-ES-001"
    zona_documento: "body"
    tipo: "keyword"
    patron: ["resultado", "hallazgo", "determinacion", "valor"]
    obligatoria: true
    mensaje_error: "No se encontraron resultados de pruebas ni hallazgos"
    peso: 3

  - id_regla: "RC-DLR-ES-002"
    zona_documento: "header"
    tipo: "keyword"
    patron: ["nhc", "historia clinica", "paciente", "dni"]
    obligatoria: true
    mensaje_error: "No se encontro identificador del paciente (NHC/DNI)"
    peso: 3

reglas_coherencia:
  - id_regla: "RCH-DLR-ES-003"
    tipo: "formato_numerico_requerido"
    campo_origen: "resultados"
    # \d{2,} (no \d): un solo digito suelto no basta, porque el OCR
    # confunde a veces "Prueba B" con "Prueba 8" (igual que confunde O/0
    # en otros protocolos), lo que hacia que la letra de una prueba mal
    # leida se contara como si fuera el valor numerico del resultado. Un
    # valor de laboratorio real (140, 8.500, 70-110) siempre tiene 2 o mas
    # digitos seguidos, asi que exigir eso descarta ese falso positivo sin
    # perder ningun caso real.
    patron_regex: "\\d{2,}"
    condicion: "Un resultado de laboratorio real siempre incluye al menos un valor, unidad o rango numerico, no solo positivo/negativo/indeterminado"
    mensaje_error: "Los resultados no incluyen ningun valor, unidad o rango numerico (formato no estandar de laboratorio)"
    peso: 3

  - id_regla: "RCH-DLR-ES-001"
    tipo: "campo_presente_si"
    campo_origen: "resultados"
    campo_destino: "medico_solicitante"
    condicion: "Si hay resultados, debe identificarse al medico solicitante"
    mensaje_error: "Existen resultados pero no se identifico al medico solicitante"
    peso: 2

  - id_regla: "RCH-DLR-ES-002"
    tipo: "texto_coherente"
    # campo_destino = campo_origen: ver nota equivalente en RCH-MED-ES-002.
    # La condicion es sobre resultados exclusivamente; medico_solicitante
    # como destino solo introducia texto sin relacion con la condicion.
    campo_origen: "resultados"
    campo_destino: "resultados"
    condicion: "Los resultados de laboratorio deben presentarse con unidades, valores y rango de referencia coherentes con un informe clinico real, no como una lista de estados sueltos sin contexto clinico"
    mensaje_error: "Los resultados no parecen tener formato ni contenido de un informe de laboratorio real"
    peso: 2

  - id_regla: "RCH-DLR-ES-004"
    tipo: "identidad_duplicada"
    condicion: "El identificador del paciente debe ser el mismo en todo el documento"
    mensaje_error: "Se encontraron identificadores de paciente distintos en el mismo documento"
    peso: 3
