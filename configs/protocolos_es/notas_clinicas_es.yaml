id_protocolo: "CN-001-ES"
version: "1.0"
proceso_sanitario: "consulta_general"
tipo_documento: "notas_clinicas"
fecha_vigencia: "2024-01-01"
base_legal: "Ley 41/2002, art. 15-16 (historia clinica)"
idioma: "spa"

campos_obligatorios:
  - nombre_zona: "identificacion_centro"
    tipo_contenido: "texto"
    zona_documento: "header"
    descripcion: "Nombre del hospital o centro sanitario"
    # "centro" (sin mas contexto) se elimino de aqui (2026-09-07): colisiona
    # con el aviso legal fijo "Codigo de centro sanitario: verificado..."
    # presente en TODOS los documentos -- ver misma nota en
    # lista_medicacion_es.yaml.
    patrones_esperados: ["hospital", "clinica", "servicio"]
    peso: 2

  - nombre_zona: "identificacion_paciente"
    tipo_contenido: "texto"
    zona_documento: "header"
    descripcion: "Nombre del paciente y numero de historia clinica (NHC)"
    patrones_esperados: ["paciente", "nombre", "fecha de nacimiento", "f. nacimiento", "nhc"]
    peso: 3

  - nombre_zona: "motivo_consulta"
    tipo_contenido: "texto"
    zona_documento: "body"
    descripcion: "Motivo de consulta o motivo de ingreso"
    patrones_esperados: ["motivo de consulta", "motivo de ingreso", "motivo", "consulta"]
    min_chars: 15
    peso: 3

  - nombre_zona: "historia_medica"
    tipo_contenido: "texto"
    zona_documento: "body"
    descripcion: "Antecedentes medicos o historia clinica relevante"
    patrones_esperados: ["antecedentes", "historia clinica", "diagnosticado", "diagnostico"]
    peso: 2

  - nombre_zona: "equipo_asistencial"
    tipo_contenido: "texto"
    zona_documento: "body"
    descripcion: "Medico responsable o equipo asistencial"
    patrones_esperados: ["medico", "dr.", "dra.", "colegiado", "col."]
    peso: 2

  - nombre_zona: "fecha_nacimiento"
    tipo_contenido: "fecha"
    zona_documento: "header"
    descripcion: "Fecha de nacimiento del paciente (campo propio, para comparar contra la fecha del documento)"
    patrones_esperados: ["fecha de nacimiento", "f. nacimiento", "f.nac", "nacimiento"]
    peso: 1
    informational: true

  - nombre_zona: "fecha_documento"
    tipo_contenido: "fecha"
    zona_documento: "header"
    descripcion: "Fecha de emision del documento (caja de datos del documento)"
    patrones_esperados: ["expedicion"]
    peso: 1
    informational: true

  - nombre_zona: "medicacion_habitual"
    tipo_contenido: "texto"
    zona_documento: "body"
    descripcion: "Medicacion habitual declarada del paciente"
    patrones_esperados: ["medicacion habitual"]
    peso: 1
    informational: true

reglas_contenido:
  - id_regla: "RC-CN-ES-001"
    zona_documento: "body"
    tipo: "keyword"
    patron: ["motivo de consulta", "motivo de ingreso", "consulta"]
    obligatoria: true
    mensaje_error: "No se encontro motivo de consulta ni motivo de ingreso"
    peso: 3

  - id_regla: "RC-CN-ES-002"
    zona_documento: "header"
    tipo: "keyword"
    patron: ["fecha de nacimiento", "f. nacimiento", "f.nac", "nacimiento"]
    obligatoria: true
    mensaje_error: "No se encontro la fecha de nacimiento del paciente"
    peso: 3

reglas_coherencia:
  - id_regla: "RCH-CN-ES-001"
    tipo: "campo_presente_si"
    campo_origen: "motivo_consulta"
    campo_destino: "historia_medica"
    condicion: "Si hay un motivo de consulta, debe existir contexto de antecedentes medicos"
    mensaje_error: "Existe motivo de consulta pero no se encontraron antecedentes medicos"
    peso: 2

  - id_regla: "RCH-CN-ES-002"
    tipo: "texto_coherente"
    campo_origen: "motivo_consulta"
    campo_destino: "historia_medica"
    condicion: "Los antecedentes medicos deben ser clinicamente coherentes con el motivo de consulta"
    mensaje_error: "Los antecedentes no parecen coherentes con el motivo de consulta"
    peso: 2

  - id_regla: "RCH-CN-ES-003"
    tipo: "fecha_posterior"
    campo_origen: "fecha_nacimiento"
    campo_destino: "fecha_documento"
    condicion: "La fecha de nacimiento del paciente debe ser anterior a la fecha del documento"
    mensaje_error: "La fecha de nacimiento es posterior a la fecha del documento"
    peso: 3

  - id_regla: "RCH-CN-ES-004"
    tipo: "identidad_duplicada"
    condicion: "El identificador del paciente debe ser el mismo en todo el documento"
    mensaje_error: "Se encontraron identificadores de paciente distintos en el mismo documento"
    peso: 3

  - id_regla: "RCH-CN-ES-005"
    tipo: "ausencia_contradicha"
    campo_origen: "medicacion_habitual"
    campo_destino: "historia_medica"
    patron_ausencia: "ninguna"
    patrones_contradiccion: ["metformina", "enalapril", "atorvastatina", "omeprazol", "paracetamol", "ibuprofeno", "apixaban", "levotiroxina", "salbutamol", "amoxicilina", "en tratamiento con"]
    condicion: "Si se declara que no hay medicacion habitual, los antecedentes no deberian mencionar un tratamiento farmacologico activo"
    mensaje_error: "Se declara 'Ninguna' medicacion habitual pero los antecedentes mencionan un tratamiento activo"
    peso: 2
