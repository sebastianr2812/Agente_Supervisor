id_protocolo: "MED-001-ES"
version: "1.0"
proceso_sanitario: "gestion_medicacion"
tipo_documento: "lista_medicacion"
fecha_vigencia: "2024-01-01"
base_legal: "Ley 41/2002, art. 15 (historia clinica)"
idioma: "spa"

campos_obligatorios:
  - nombre_zona: "identificacion_centro"
    tipo_contenido: "texto"
    zona_documento: "header"
    descripcion: "Nombre del hospital o centro"
    # "centro" (sin mas contexto) se elimino de aqui (2026-09-07): colisiona
    # con el aviso legal fijo "Codigo de centro sanitario: verificado..."
    # que aparece en TODOS los documentos, presente o no esta identificacion
    # -- con el upscaling de OCR ese texto boilerplate se volvio legible con
    # suficiente fiabilidad para producir un falso positivo real en
    # documentos "incomplete" donde el campo se omite a proposito.
    patrones_esperados: ["hospital", "clinica", "farmacia"]
    peso: 1

  - nombre_zona: "identificacion_paciente"
    tipo_contenido: "texto"
    zona_documento: "header"
    descripcion: "Nombre del paciente y fecha de nacimiento"
    patrones_esperados: ["paciente", "nombre", "fecha de nacimiento", "nhc"]
    peso: 3

  - nombre_zona: "medicamentos"
    tipo_contenido: "texto"
    zona_documento: "body"
    descripcion: "Lista de medicamentos con dosis y posologia"
    patrones_esperados: ["mg", "dosis", "posologia", "medicamento", "comprimido", "cada"]
    min_chars: 15
    peso: 3

  - nombre_zona: "fecha_nacimiento"
    tipo_contenido: "fecha"
    zona_documento: "header"
    descripcion: "Fecha de nacimiento del paciente (campo propio, para comparar contra la fecha del documento)"
    patrones_esperados: ["fecha de nacimiento", "f. nacimiento", "f.nac", "nacimiento"]
    peso: 1
    informational: true

  - nombre_zona: "fecha_documento"
    tipo_contenido: "fecha"
    zona_documento: "header"
    descripcion: "Fecha de emision del documento (caja de datos del documento)"
    patrones_esperados: ["revision:"]
    peso: 1
    informational: true

  - nombre_zona: "alergias"
    tipo_contenido: "texto"
    zona_documento: "header"
    descripcion: "Alergias conocidas del paciente"
    # "alergia" (singular, suelto) se cambio por "alergias" (plural,
    # 2026-09-08): "alergia" colisiona con el ID del propio documento en la
    # marca de agua del header ("Documento n.: MED-001-ES_inconsistent_
    # alergia_v0N" -- el nombre de estado es singular), que aparece antes
    # que la etiqueta real "Alergias conocidas:" en el orden de lectura --
    # solo afecta a los 3 docs de la familia inconsistent_alergia, pero en
    # esos 3 causaba que la ventana de texto usada por
    # check_allergy_contraindication se anclara en la marca de agua en vez
    # de en la alergia real declarada. "alergias conocidas" solo (sin la
    # forma de una palabra) NO basta como respaldo: el OCR tokeniza
    # palabra por palabra, y esa frase de 2 palabras casi nunca cae en un
    # solo bloque -- se necesita ademas la forma de una palabra "alergias"
    # (que SI coincide con el bloque de la etiqueta real "Alergias", un
    # solo token) para que el patron funcione en la mayoria de los casos.
    # "alergias" (con "s") no colisiona con "alergia" (sin "s") de la marca
    # de agua. Misma naturaleza que la colision "centro"/"tel." documentada
    # en notas_clinicas_es.yaml.
    patrones_esperados: ["alergias conocidas", "alergias"]
    peso: 1
    informational: true

reglas_contenido:
  - id_regla: "RC-MED-ES-001"
    zona_documento: "body"
    tipo: "keyword"
    patron: ["mg", "dosis", "comprimido", "ml"]
    obligatoria: true
    mensaje_error: "No se encontro medicacion con informacion de dosis"
    peso: 3

  - id_regla: "RC-MED-ES-002"
    zona_documento: "header"
    tipo: "keyword"
    patron: ["paciente", "nombre"]
    obligatoria: true
    mensaje_error: "No se encontro identificacion del paciente"
    peso: 3

  - id_regla: "RC-MED-ES-003"
    zona_documento: "body"
    tipo: "ausencia_regex"
    patron: "sin informaci.n de dosis"
    obligatoria: true
    mensaje_error: "El documento indica explicitamente que uno o mas medicamentos no tienen informacion de dosis"
    peso: 3

reglas_coherencia:
  - id_regla: "RCH-MED-ES-001"
    tipo: "campo_presente_si"
    campo_origen: "medicamentos"
    campo_destino: "identificacion_paciente"
    condicion: "Si hay medicamentos listados, el paciente debe estar identificado"
    mensaje_error: "Hay medicamentos listados pero no se identifico al paciente"
    peso: 3

  - id_regla: "RCH-MED-ES-002"
    tipo: "texto_coherente"
    # campo_destino = campo_origen (no identificacion_paciente): la condicion
    # de abajo es un chequeo de formato de UN solo campo (medicamentos), no
    # una relacion entre dos campos. Con identificacion_paciente como
    # destino, el LLM recibia como "Seccion B" texto de membrete/legal sin
    # relacion con medicamentos (o incluso vacio cuando el campo esta
    # ausente) y terminaba juzgando "de que habla cada seccion" en vez de la
    # condicion pedida, generando falsos positivos verificados (ver hallazgo
    # 22). Al usar el mismo campo en origen y destino, el LLM evalua la
    # condicion sobre el contenido real, sin ruido de un segundo campo
    # irrelevante.
    campo_origen: "medicamentos"
    campo_destino: "medicamentos"
    condicion: "La lista de medicamentos debe incluir dosis y posologia coherentes con una prescripcion real, no una lista de nombres de medicamentos sin dosis ni frecuencia"
    mensaje_error: "La lista de medicamentos no incluye dosis ni posologia coherentes"
    peso: 2

  - id_regla: "RCH-MED-ES-003"
    tipo: "fecha_posterior"
    campo_origen: "fecha_nacimiento"
    campo_destino: "fecha_documento"
    condicion: "La fecha de nacimiento del paciente debe ser anterior a la fecha del documento"
    mensaje_error: "La fecha de nacimiento es posterior a la fecha del documento"
    peso: 3

  - id_regla: "RCH-MED-ES-004"
    tipo: "identidad_duplicada"
    condicion: "El identificador del paciente debe ser el mismo en todo el documento"
    mensaje_error: "Se encontraron identificadores de paciente distintos en el mismo documento"
    peso: 3
